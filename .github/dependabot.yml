# ============================================================================
# Dependabot Configuration - Automated Dependency Updates
# ============================================================================

version: 2

registries:
  # No private registries needed for this project

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
    reviewers:
      - "Debyte404"

  # PlatformIO dependencies (via pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 3
