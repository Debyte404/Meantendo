name: 🔍 CodeQL Configuration
description: Security and quality analysis configuration for Meantendo

# Use default queries plus security-extended
queries:
  - uses: security-extended
  - uses: security-and-quality

# Path filters
paths-ignore:
  - '**/*.md'
  - '**/*.txt'
  - 'docs/**'
  - '.github/**'
  - 'test/**'

# Query filters to reduce noise
query-filters:
  - exclude:
      id: cpp/commented-out-code
  - exclude:
      id: cpp/poorly-documented-function
