; PlatformIO Project Configuration File for Meantendo Console

[env:esp32dev]
platform = espressif32 @ ~6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags = 
  -std=gnu++17
  -Os
  -DCORE_DEBUG_LEVEL=0
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
  lemmingdev/ESP32-BLE-Gamepad @ ^0.8.0

[env:hw_diagnostics]
platform = espressif32 @ ~6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM11
monitor_port = COM11
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags = 
  -std=gnu++17

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
  lemmingdev/ESP32-BLE-Gamepad @ ^0.8.0

build_src_filter = -<*> +<../test/hw_diagnostics.cpp>
