# ============================================================================
# Meantendo - Comprehensive Continuous Integration Pipeline
# ============================================================================
#
# This workflow runs on all PRs and pushes to ensure code quality.
# Features:
#   - Multi-environment build matrix
#   - Static analysis (Cppcheck, Clang-Tidy)
#   - Code formatting checks
#   - Unit testing (when available)
#   - Build size tracking
#   - Documentation validation
#
# Author: Debyte
# ============================================================================

name: 🔬 Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_CORE_DIR: .platformio

jobs:
  # ============================================================================
  # Pre-flight Checks
  # ============================================================================
  preflight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Skip Duplicate Actions
        id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: 'true'

  # ============================================================================
  # Build Matrix - All Target Platforms
  # ============================================================================
  build:
    name: 🔨 Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_skip != 'true'
    
    strategy:
      fail-fast: false
      matrix:
        variant:
          - esp32dev
          - esp32dev_release
          - esp32s3
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.variant }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.variant }}-
            ${{ runner.os }}-pio-
      
      - name: ⬇️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio pkg update
      
      - name: 🔨 Build Firmware
        id: build
        run: |
          set -e
          echo "🚀 Building variant: ${{ matrix.variant }}"
          pio run -e ${{ matrix.variant }}
          
          # Get firmware size
          FIRMWARE_SIZE=$(stat -c%s .pio/build/${{ matrix.variant }}/firmware.bin 2>/dev/null || echo "0")
          echo "firmware_size=$FIRMWARE_SIZE" >> $GITHUB_OUTPUT
          echo "📊 Firmware size: $FIRMWARE_SIZE bytes"
      
      - name: 📊 Report Build Size
        run: |
          echo "### 📊 Build Size Report - ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Firmware Size | ${{ steps.build.outputs.firmware_size }} bytes |" >> $GITHUB_STEP_SUMMARY
          
          # Memory analysis if available
          if [ -f .pio/build/${{ matrix.variant }}/firmware.elf ]; then
            pio run -e ${{ matrix.variant }} -t size 2>/dev/null | tail -20 >> $GITHUB_STEP_SUMMARY || true
          fi
      
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.variant }}
          path: |
            .pio/build/${{ matrix.variant }}/firmware.bin
            .pio/build/${{ matrix.variant }}/firmware.elf
          retention-days: 7

  # ============================================================================
  # Static Analysis - Code Quality
  # ============================================================================
  static-analysis:
    name: 🔬 Static Analysis
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_skip != 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy-15 clang-format-15
          sudo ln -sf /usr/bin/clang-tidy-15 /usr/bin/clang-tidy
          sudo ln -sf /usr/bin/clang-format-15 /usr/bin/clang-format
      
      - name: 🔍 Run Cppcheck
        id: cppcheck
        run: |
          echo "### 🔍 Cppcheck Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --error-exitcode=0 \
            --inline-suppr \
            --std=c++17 \
            -I include \
            -I src \
            --xml --xml-version=2 \
            src/ include/ main/ 2> cppcheck-report.xml
          
          # Convert to readable format
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --std=c++17 \
            -I include \
            -I src \
            src/ include/ main/ 2> cppcheck-report.txt || true
          
          # Count issues
          ERRORS=$(grep -c " error " cppcheck-report.txt 2>/dev/null || echo "0")
          WARNINGS=$(grep -c " warning " cppcheck-report.txt 2>/dev/null || echo "0")
          STYLE=$(grep -c " style " cppcheck-report.txt 2>/dev/null || echo "0")
          
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| Style | $STYLE |" >> $GITHUB_STEP_SUMMARY
          
          # Fail on errors only
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Cppcheck found errors!"
            cat cppcheck-report.txt
            exit 1
          fi
          
          echo "cppcheck_passed=true" >> $GITHUB_OUTPUT
      
      - name: 📊 Upload Analysis Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.xml
            cppcheck-report.txt
          retention-days: 14

  # ============================================================================
  # Code Formatting Check
  # ============================================================================
  formatting:
    name: 🎨 Code Formatting
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_skip != 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🔧 Setup clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-15
          sudo ln -sf /usr/bin/clang-format-15 /usr/bin/clang-format
          clang-format --version
      
      - name: 🎨 Check Formatting
        id: format_check
        run: |
          echo "### 🎨 Formatting Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create .clang-format if not exists
          if [ ! -f .clang-format ]; then
            cat > .clang-format << 'EOF'
          ---
          Language: Cpp
          BasedOnStyle: Google
          IndentWidth: 4
          ColumnLimit: 100
          AllowShortFunctionsOnASingleLine: Inline
          AllowShortIfStatementsOnASingleLine: Never
          AllowShortLoopsOnASingleLine: false
          AlignConsecutiveAssignments: true
          AlignConsecutiveDeclarations: false
          BreakBeforeBraces: Attach
          PointerAlignment: Left
          SpaceAfterCStyleCast: false
          IncludeBlocks: Preserve
          ...
          EOF
          fi
          
          # Find all C/C++ files and check formatting
          FILES=$(find src include main -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.c" -o -name "*.h" \) 2>/dev/null || echo "")
          
          if [ -z "$FILES" ]; then
            echo "✅ No C/C++ files found to check." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          BADLY_FORMATTED=""
          for file in $FILES; do
            if ! clang-format --dry-run --Werror "$file" 2>/dev/null; then
              BADLY_FORMATTED="$BADLY_FORMATTED $file"
            fi
          done
          
          if [ -n "$BADLY_FORMATTED" ]; then
            echo "⚠️ The following files need formatting:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$BADLY_FORMATTED" | tr ' ' '\n' | grep -v '^$' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run \`clang-format -i <file>\` to fix." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Some files are not properly formatted"
          else
            echo "✅ All files are properly formatted!" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Documentation Check
  # ============================================================================
  docs:
    name: 📚 Documentation Check
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_skip != 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 📄 Validate Documentation
        run: |
          echo "### 📚 Documentation Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for required files
          REQUIRED_FILES=("README.md" "LICENSE" "CONTRIBUTING.md" "CODE_OF_CONDUCT.md")
          MISSING=""
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file" 2>/dev/null || echo "0")
              echo "✅ \`$file\` ($SIZE bytes)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ \`$file\` - **MISSING**" >> $GITHUB_STEP_SUMMARY
              MISSING="$MISSING $file"
            fi
          done
          
          # Check for meaningful README
          if [ -f "README.md" ]; then
            LINES=$(wc -l < README.md)
            if [ "$LINES" -lt 20 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ README.md is quite short ($LINES lines). Consider expanding it!" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: 🔗 Check for Broken Links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress '*.md' 'docs/**/*.md' --accept '200..299,403,429'
          fail: false
        continue-on-error: true

  # ============================================================================
  # Unit Tests (PlatformIO Test)
  # ============================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.should_skip != 'true'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-test-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-test-
      
      - name: ⬇️ Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: 🧪 Run Unit Tests
        id: test
        run: |
          echo "### 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if tests exist
          if [ -d "test" ] && [ "$(find test -name '*.cpp' | wc -l)" -gt 0 ]; then
            # Run tests on native platform if available
            pio test -e native 2>&1 | tee test-output.txt || true
            
            # Parse results for summary
            if grep -q "PASSED" test-output.txt; then
              echo "✅ Tests passed!" >> $GITHUB_STEP_SUMMARY
            elif grep -q "FAILED" test-output.txt; then
              echo "❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
              cat test-output.txt >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Test framework not configured for native testing." >> $GITHUB_STEP_SUMMARY
              echo "Consider adding a \`[env:native]\` section to platformio.ini for unit tests." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No test files found in \`test/\` directory." >> $GITHUB_STEP_SUMMARY
            echo "Consider adding unit tests for better code coverage." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # All Checks Gate
  # ============================================================================
  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    needs: [build, static-analysis, formatting, docs, test]
    if: always()
    
    steps:
      - name: 📋 Summary
        run: |
          echo "### 🎯 CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Formatting | ${{ needs.formatting.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '⚠️ Check logs' }} |" >> $GITHUB_STEP_SUMMARY
      
      - name: 🎉 All Checks Passed
        if: needs.build.result == 'success'
        run: |
          echo "🎉 All critical CI checks passed!"
          exit 0
      
      - name: ❌ CI Failed
        if: needs.build.result != 'success'
        run: |
          echo "❌ CI failed - build step did not pass"
          exit 1
