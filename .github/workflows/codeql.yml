# ============================================================================
# Meantendo - CodeQL Security Analysis
# ============================================================================
#
# Performs advanced static analysis for security vulnerabilities.
# Runs on a schedule and on PRs to catch security issues early.
#
# Author: Debyte
# ============================================================================

name: 🔒 CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🔬 Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔧 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      
      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml
        continue-on-error: true
      
      - name: 🔨 Build for Analysis
        run: |
          # Build with PlatformIO for CodeQL to analyze
          pio run -e esp32dev || echo "Build completed (some errors may be expected during analysis)"
      
      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          upload: true
        continue-on-error: true
      
      - name: 📋 Summary
        run: |
          echo "### 🔒 Security Analysis Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CodeQL analysis has been completed. Any security issues found will be reported in the Security tab." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Language analyzed:** ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
