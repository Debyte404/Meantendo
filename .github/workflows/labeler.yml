# ============================================================================
# Meantendo - Automatic PR Labeler
# ============================================================================
#
# Automatically applies labels to PRs based on the files changed.
# Helps with triaging and review prioritization.
#
# Author: Debyte
# ============================================================================

name: 🏷️ PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Apply Labels
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏷️ Apply Labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
