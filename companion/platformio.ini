; PlatformIO Configuration for Meantendo Companion Bridge & Tester Bot
; Supports ESP32 DevKit, ESP32-S2, and Automated Multiplayer Tester Bot

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    links2004/WebSockets @ ^2.4.1

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=0
lib_deps =
    links2004/WebSockets @ ^2.4.1

[env:tester_bot]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D TESTER_BOT_AUTOSTART=1
lib_deps =
    links2004/WebSockets @ ^2.4.1
