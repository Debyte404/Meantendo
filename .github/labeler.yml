# ============================================================================
# Meantendo - PR Labeler Configuration
# ============================================================================
# Automatically applies labels to PRs based on changed files

# Core system changes
core:
  - changed-files:
      - any-glob-to-any-file: 'src/core/**'
      - any-glob-to-any-file: 'include/**'

# Game-related changes
games:
  - changed-files:
      - any-glob-to-any-file: 'src/games/**'
      - any-glob-to-any-file: 'test/games/**'

# OTA system changes
ota:
  - changed-files:
      - any-glob-to-any-file: 'src/ota/**'

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'
      - any-glob-to-any-file: 'docs/**'

# Build system changes
build:
  - changed-files:
      - any-glob-to-any-file: 'platformio.ini'
      - any-glob-to-any-file: 'CMakeLists.txt'
      - any-glob-to-any-file: 'partitions/**'
      - any-glob-to-any-file: 'sdkconfig*'

# CI/CD changes
ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# Test changes
tests:
  - changed-files:
      - any-glob-to-any-file: 'test/**'

# Component changes
components:
  - changed-files:
      - any-glob-to-any-file: 'components/**'

# Configuration changes
config:
  - changed-files:
      - any-glob-to-any-file: '*.json'
      - any-glob-to-any-file: '*.yml'
      - any-glob-to-any-file: '*.yaml'
