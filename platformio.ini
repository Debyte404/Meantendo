; ============================================================================
; PlatformIO Project Configuration - Meantendo Gaming Console
; Author: Debyte
; ============================================================================
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; ============================================================================
; Common settings shared across all environments
; ============================================================================
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags = 
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D HTTPCLIENT_1_1_COMPATIBLE=0
    -std=gnu++17
    -D _GNU_SOURCE
    -D _POSIX_C_SOURCE
    -D MEANTENDO_VERSION_MAJOR=1
    -D MEANTENDO_VERSION_MINOR=0
    -D MEANTENDO_VERSION_PATCH=0
    -std=gnu++17

; Common library dependencies
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1

; ============================================================================
; Development Environment (ESP32 DevKit)
; ============================================================================
[env:esp32dev]
board = esp32dev
upload_port = COM7

; Use custom partition table with OTA support
board_build.partitions = partitions/ota_partitions.csv

; Extra build flags for dev
build_flags = 
    ${env.build_flags}
    -D DEBUG_OTA=1
    -D OTA_WEB_UI_ENABLED=1

; ============================================================================
; Production Environment (Optimized)
; ============================================================================
[env:esp32dev_release]
board = esp32dev
upload_port = COM7

; Use custom partition table with OTA support
board_build.partitions = partitions/ota_partitions.csv

; Optimized build
build_flags = 
    ${env.build_flags}
    -O2
    -D NDEBUG
    -D OTA_WEB_UI_ENABLED=1

build_unflags = -Os

; ============================================================================
; ESP32-S3 Variant (for future expansion)
; ============================================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM7

board_build.partitions = partitions/ota_partitions.csv

build_flags = 
    ${env.build_flags}
    -D MEANTENDO_VARIANT_S3=1

lib_deps = ${env.lib_deps}

; ============================================================================
; Native Desktop Environment (for localized unit testing)
; ============================================================================
[env:native]
platform = native
test_framework = unity
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    faboubaker/ArduinoUnit @ ^3.0.4
    tonton81/ArduinoFake @ ^0.0.2
build_flags = 
    -D NATIVE_TESTing=1
    -D ARDUINO=100
    -std=c++17
